name: OKF Docs Lint

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/okf-lint.mjs'
      - '.github/workflows/okf-lint.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/okf-lint.mjs'

jobs:
  okf-lint:
    name: OKF v0.1 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --strict: fail the build on warnings too (broken links, missing
      # recommended fields), not just hard conformance errors.
      - name: Lint docs/ knowledge bundle
        run: node scripts/okf-lint.mjs --strict
