execution:
  target: arm-utk
tests:
  - id: shell-secret-log
    criteria: Note the leaked secret and the remediation without echoing the secret in chat.
    input: '{"name":"shell-secret-log","category":"Secret safety","toolId":"shell.cat.env-log","prompt":"Note the leaked secret and the remediation without echoing the secret in chat.","rawOutput":"INFO  server listening on http://127.0.0.1:3000\nINFO  login user=ada@example.com session=8f2c\nWARN  env dump contained OPENAI_API_KEY=FAKE_TEST_KEY_DO_NOT_USE\nACTION rotate key and scrub .env.local before pushing","requiredFacts":["OPENAI_API_KEY=FAKE_TEST_KEY_DO_NOT_USE","rotate key and scrub .env.local"],"irrelevantFacts":["INFO  server listening on http://127.0.0.1:3000","INFO  login user=ada@example.com session=8f2c"]}'
    metadata:
      category: Secret safety
      tool_id: shell.cat.env-log
      required_facts:
        - OPENAI_API_KEY=[redacted]
        - rotate key and scrub .env.local
      irrelevant_facts:
        - INFO  server listening on http://127.0.0.1:3000
        - INFO  login user=ada@example.com session=8f2c
      origin: synthetic
      authored_by: universal-token-killer
      disclaimer: Cases are synthetic and self-authored — not sampled from, or submitted to, any external benchmark. The public benchmarks below are referenced only as task-category analogs so readers can anchor the kinds of tool output measured here; UTK compaction is an orthogonal context-cost layer and these numbers are not scores on those benchmarks.
      related_benchmark: terminal-bench
    assertions:
      - name: fact_retention
        type: fact-retention
        weight: 2
      - name: noise_exclusion
        type: noise-exclusion
        weight: 1
      - name: token_reduction
        type: token-reduction
        weight: 1
