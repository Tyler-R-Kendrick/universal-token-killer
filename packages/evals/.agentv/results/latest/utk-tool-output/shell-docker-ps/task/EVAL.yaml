    metadata:
      category: Containers
      tool_id: shell.docker.ps
      required_facts:
        - utk-worker-1
        - unhealthy
      irrelevant_facts:
        - a1b2c3d4e5f6   utk-web      Up 2 hours (healthy)        utk-web-1
        - bb11cc22dd33   utk-cache    Up 2 hours (healthy)        utk-cache-1
      origin: synthetic
