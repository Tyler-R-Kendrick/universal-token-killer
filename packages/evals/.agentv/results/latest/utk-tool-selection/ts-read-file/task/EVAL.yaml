      related_benchmark: bfcl
    assertions:
      - name: fact_retention
        type: fact-retention
        weight: 2
      - name: noise_exclusion
        type: noise-exclusion
        weight: 1
      - name: token_reduction
        type: token-reduction
        weight: 1
      - name: unsafe_tool_exposure
        type: unsafe-tool-exposure
        weight: 1
