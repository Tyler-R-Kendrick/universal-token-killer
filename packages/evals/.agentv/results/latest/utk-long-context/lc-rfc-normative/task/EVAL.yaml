tests:
  - id: lc-rfc-normative
    criteria: What is the single normative requirement and the default timeout?
    input: '{"name":"lc-rfc-normative","category":"Specification","toolId":"doc.rfc.spec","prompt":"What is the single normative requirement and the default timeout?","rawOutput":"RFC 0042 — Session Token Refresh\nStatus: Draft\nAuthors: platform-team\n1. Introduction\nThis document describes how clients refresh session tokens. Background context\nabout why sessions exist is provided for readers new to the system.\n2. Terminology\nThe words used here follow common industry meaning. Nothing surprising.\n3. Motivation\nHistorically clients re-authenticated from scratch, which was wasteful.\n4. Requirements\nClients MUST refresh the token before it expires using the /refresh endpoint.\nThe default refresh timeout is 900 seconds unless overridden by the server.\n5. Non-goals\nThis RFC does not cover token revocation, which is handled elsewhere.\n6. Security considerations\nStandard transport security applies; use TLS 1.2 or newer.\n7. Acknowledgements\nThanks to everyone who reviewed early drafts over lunch.","requiredFacts":["Clients MUST refresh the token before it expires","default refresh timeout is 900 seconds"],"irrelevantFacts":["Thanks to everyone who reviewed early drafts over lunch.","The words used here follow common industry meaning."]}'
    metadata:
      category: Specification
      tool_id: doc.rfc.spec
      required_facts:
        - Clients MUST refresh the token before it expires
        - default refresh timeout is 900 seconds
      irrelevant_facts:
        - Thanks to everyone who reviewed early drafts over lunch.
        - The words used here follow common industry meaning.
      origin: synthetic
      authored_by: universal-token-killer
      disclaimer: Cases are synthetic and self-authored — not sampled from, or submitted to, any external benchmark. The public benchmarks below are referenced only as task-category analogs so readers can anchor the kind of long-context compression measured here; these numbers are not scores on those benchmarks.
      related_benchmark: longbench-v2
    assertions:
      - name: fact_retention
        type: fact-retention
        weight: 2
      - name: noise_exclusion
        type: noise-exclusion
        weight: 1
      - name: token_reduction
        type: token-reduction
        weight: 1
