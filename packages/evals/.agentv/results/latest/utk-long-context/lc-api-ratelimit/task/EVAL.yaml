    input: '{"name":"lc-api-ratelimit","category":"API reference","toolId":"doc.api.reference","prompt":"What is the rate limit and the required auth header for the search endpoint?","rawOutput":"Search API Reference\nOverview\nThe Search API lets you query the catalog. It is REST over HTTPS and returns JSON.\nEndpoints\nGET /v1/search — full text search across products\nGET /v1/categories — list the category tree\nGET /v1/suggest — typeahead suggestions\nAuthentication\nAll requests require the header Authorization: Bearer <token>.\nRate limits\nThe /v1/search endpoint is limited to 60 requests per minute per key.\nPagination\nUse the \"cursor\" query parameter to page through results.\nErrors\nThe API returns standard HTTP status codes and a JSON error body.\nSupport\nReach the team on the community forum for general questions.","requiredFacts":["limited to 60 requests per minute per key","Authorization: Bearer <token>"],"irrelevantFacts":["Reach the team on the community forum for general questions.","GET /v1/suggest — typeahead suggestions"]}'
