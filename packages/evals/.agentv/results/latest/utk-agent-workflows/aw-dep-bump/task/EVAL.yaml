execution:
  target: arm-utk
tests:
  - id: aw-dep-bump
    criteria: After bumping the HTTP client, which call broke and how do we fix it?
    input: '{"name":"aw-dep-bump","category":"Dependency upgrade","toolId":"workflow.swe.deps","prompt":"After bumping the HTTP client, which call broke and how do we fix it?","rawOutput":"Upgrade report: httpclient 2.x -> 3.x\nChanged APIs:\n- httpclient.get(url, timeout=) removed; use httpclient.get(url, options={\"timeout\":})\n- httpclient.Session renamed to httpclient.Client\nBreak located: src/net/fetcher.py:63 calls httpclient.get(url, timeout=5)\nFix: httpclient.get(url, options={\"timeout\": 5}) at src/net/fetcher.py:63\nUnaffected: the retry helper in src/net/retry.py uses the new API already\nNote: the upgrade also improves TLS defaults\nNote: see the vendor migration guide for the full list","requiredFacts":["Break located: src/net/fetcher.py:63 calls httpclient.get(url, timeout=5)","Fix: httpclient.get(url, options={\"timeout\": 5}) at src/net/fetcher.py:63"],"irrelevantFacts":["Note: the upgrade also improves TLS defaults","Unaffected: the retry helper in src/net/retry.py uses the new API already"]}'
    metadata:
      category: Dependency upgrade
      tool_id: workflow.swe.deps
      required_facts:
        - "Break located: src/net/fetcher.py:63 calls httpclient.get(url, timeout=5)"
        - 'Fix: httpclient.get(url, options={"timeout": 5}) at src/net/fetcher.py:63'
      irrelevant_facts:
        - "Note: the upgrade also improves TLS defaults"
        - "Unaffected: the retry helper in src/net/retry.py uses the new API already"
      origin: synthetic
      authored_by: universal-token-killer
      disclaimer: Cases are synthetic and self-authored — not sampled from, or submitted to, any external benchmark. The public benchmarks below are referenced only as task-category analogs so readers can anchor the agent-workflow and coding task; these numbers are not scores on those benchmarks.
      related_benchmark: swe-bench-verified
    assertions:
      - name: fact_retention
        type: fact-retention
        weight: 2
      - name: noise_exclusion
        type: noise-exclusion
        weight: 1
      - name: token_reduction
        type: token-reduction
        weight: 1
