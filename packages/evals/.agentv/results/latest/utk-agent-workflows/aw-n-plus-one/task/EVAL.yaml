    input: '{"name":"aw-n-plus-one","category":"Performance","toolId":"workflow.swe.perf","prompt":"A page is slow from an N+1 query. Which file and function cause it?","rawOutput":"Profiler summary for GET /dashboard (2.9s)\nSlowest span: database (2.6s across 412 queries)\nQuery pattern: SELECT * FROM comments WHERE post_id = ? repeated 400 times\nRoot cause: N+1 query in src/views/dashboard.py in build_feed(), which loops posts and loads comments per post\nFix hint: prefetch comments with a single IN query before the loop\nOther spans: template render 0.2s, serialization 0.1s\nNote: the profiler adds ~5% overhead\nNote: run captured on the staging dataset","requiredFacts":["N+1 query in src/views/dashboard.py in build_feed()","prefetch comments with a single IN query before the loop"],"irrelevantFacts":["Note: the profiler adds ~5% overhead","Other spans: template render 0.2s, serialization 0.1s"]}'
