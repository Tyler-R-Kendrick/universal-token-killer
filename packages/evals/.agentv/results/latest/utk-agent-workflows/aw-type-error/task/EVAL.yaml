    input: '{"name":"aw-type-error","category":"Type error","toolId":"workflow.swe.types","prompt":"Where is the type error and what type is expected?","rawOutput":"$ mypy src\nsrc/api/handlers.py:120: error: Argument 1 to \"save_order\" has incompatible type \"str\"; expected \"Order\"\nsrc/api/handlers.py:120: note: the id string is being passed where an Order object is required\nsrc/util/format.py:12: note: unrelated style hint about line length\nFound 1 error in 1 file (checked 87 source files)\nFix: construct an Order from the id before calling save_order at src/api/handlers.py:120\nNote: mypy cache stored in .mypy_cache\nNote: run took 4.1 seconds","requiredFacts":["src/api/handlers.py:120: error: Argument 1 to \"save_order\" has incompatible type \"str\"; expected \"Order\"","construct an Order from the id before calling save_order at src/api/handlers.py:120"],"irrelevantFacts":["Note: mypy cache stored in .mypy_cache","src/util/format.py:12: note: unrelated style hint about line length"]}'
