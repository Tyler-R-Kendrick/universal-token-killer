suite: tool-output
tests:
  - id: shell-git-status
    input:
      - role: user
        content: "Summarize the dirty worktree without losing modified or untracked files."
    expected_output: |
      {
        "prompt": "Summarize the dirty worktree without losing modified or untracked files.",
        "rawOutput": "On branch claude/evals-structure-redesign\nYour branch is ahead of 'origin/main' by 2 commits.\n  (use \"git push\" to publish your local commits)\n\nChanges not staged for commit:\n  (use \"git add <file>...\" to update what will be committed)\n\t modified:   README.md\n\nUntracked files:\n\t packages/evals/harness.ts\n\t packages/evals/data/tool-output.jsonl\n\nno changes added to commit (use \"git add\" and/or \"git commit -a\")",
        "requiredFacts": [
          "modified:   README.md",
          "packages/evals/harness.ts",
          "packages/evals/data/tool-output.jsonl"
        ],
        "irrelevantFacts": [
          "(use \"git push\" to publish your local commits)",
          "no changes added to commit (use \"git add\" and/or \"git commit -a\")"
        ]
      }
    assertions:
      - name: composite
        type: script
        command: ["node", "packages/evals/dist/graders/compositeGrader.js"]
        weight: 1
      - name: tokens
        type: script
        command: ["node", "packages/evals/dist/graders/tokenGrader.js"]
      - name: relevance
        type: script
        command: ["node", "packages/evals/dist/graders/relevanceGrader.js"]
