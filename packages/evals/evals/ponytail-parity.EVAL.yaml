tests:
  - id: fetch-json-retry-lite
    input:
      - role: user
        content: "Add fetchJsonWithRetry(requestUrl, maxAttempts, timeoutMs) with abort timeout and status checks, plus a fetchJsonOrNull wrapper. Emit a UTK min emission (@minmap patch plus min code) against the ponytail lite arm."
    expected_output: |
      {
        "scenario": "fetch-json-retry",
        "ponytail_mode": "lite",
        "ponytail_baseline": "// Reviewed the request; this is the simplest sufficient implementation.\nexport async function fetchJsonWithRetry(requestUrl: string, maxAttempts: number, timeoutMs: number) {\nlet lastError: unknown;\nfor (let attempt = 0; attempt < maxAttempts; attempt += 1) {\ntry {\nconst response = await fetch(requestUrl, { signal: AbortSignal.timeout(timeoutMs) });\nif (!response.ok) {\nthrow new Error('retry request failed with status ' + response.status);\n}\nreturn await response.json();\n} catch (caught) {\nlastError = caught;\n}\n}\nthrow lastError;\n}\nexport async function fetchJsonOrNull(requestUrl: string, maxAttempts: number, timeoutMs: number) {\ntry {\nreturn await fetchJsonWithRetry(requestUrl, maxAttempts, timeoutMs);\n} catch {\nreturn null;\n}\n}",
        "verbose_baseline": "Sure! Here is a robust retry helper plus a null-safe wrapper. The helper wraps the native fetch API, adds an\nAbortSignal-based timeout so requests cannot hang forever, validates the HTTP status, and retries up to the\nconfigured number of attempts before surfacing the last error it saw.\n\nexport async function fetchJsonWithRetry(requestUrl: string, maxAttempts: number, timeoutMs: number) {\nlet lastError: unknown;\nfor (let attempt = 0; attempt < maxAttempts; attempt += 1) {\ntry {\nconst response = await fetch(requestUrl, { signal: AbortSignal.timeout(timeoutMs) });\nif (!response.ok) {\nthrow new Error('retry request failed with status ' + response.status);\n}\nreturn await response.json();\n} catch (caught) {\nlastError = caught;\n}\n}\nthrow lastError;\n}\nexport async function fetchJsonOrNull(requestUrl: string, maxAttempts: number, timeoutMs: number) {\ntry {\nreturn await fetchJsonWithRetry(requestUrl, maxAttempts, timeoutMs);\n} catch {\nreturn null;\n}\n}\n\nYou can tune maxAttempts and timeoutMs per call site; the wrapper swallows the final error and returns null for\ncallers that prefer a soft failure.",
        "expected_pretty": "export async function fetchJsonWithRetry(requestUrl: string, maxAttempts: number, timeoutMs: number) {\nlet lastError: unknown;\nfor (let attempt = 0; attempt < maxAttempts; attempt += 1) {\ntry {\nconst response = await fetch(requestUrl, { signal: AbortSignal.timeout(timeoutMs) });\nif (!response.ok) {\nthrow new Error('retry request failed with status ' + response.status);\n}\nreturn await response.json();\n} catch (caught) {\nlastError = caught;\n}\n}\nthrow lastError;\n}\nexport async function fetchJsonOrNull(requestUrl: string, maxAttempts: number, timeoutMs: number) {\ntry {\nreturn await fetchJsonWithRetry(requestUrl, maxAttempts, timeoutMs);\n} catch {\nreturn null;\n}\n}",
        "required_terms": [
          "fetchJsonWithRetry",
          "fetchJsonOrNull",
          "requestUrl",
          "maxAttempts",
          "AbortSignal",
          "fetch",
          "json",
          "lastError"
        ],
        "map_entries": [],
        "macro_names": [],
        "max_token_ratio": 1,
        "ponytail_tokens": 185
      }
    assertions:
      - name: ponytail-parity
        type: code-grader
        command: ["node", "packages/evals/dist/graders/ponytailParityCodeGrader.js"]
